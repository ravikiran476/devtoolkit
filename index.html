<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browser-based developer utilities: JSON, JWT, URL/Base64, regex, timestamps, UUIDs and cron." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='21' font-family='monospace' font-size='14' font-weight='700' fill='white' text-anchor='middle'>{}</text></svg>" />
    <title>DevToolkit</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('devtoolkit-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
